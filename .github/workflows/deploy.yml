name: Push 기반 CI/CD 테스트

# container 브랜치에서 push 이벤트 발생시 처리(작동)
on:
    push:
      # 브랜치가 n개로 늘어나는 경우 효율적 표현
      branches: [ "container" ]

jobs:
    cicd:
        runs-on: ubuntu-latest

        steps:
            - name: 코드 checkout
              uses: actions/checkout@v5
            - name: 소스코드 확인 검증
              run:  |
                pwd
                ls -al
                cat main.py
              shell: bash

            - name: sourcecode copy to EC2
              uses: appleboy/scp-action@master
              with:
                # 시크릿 변수를 가져와서 설정 내용
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.EC2KEY }}
                port: 22
                # 편의상 현재 디렉토리의 모든 내용 카피
                source: .
                # aws ec2 서버의 특정 위치에 카피
                # /home/ubuntu/projects/*.* 세팅
                target: "/home/ubuntu/projects"

            # 서비스 재가동 명령 전달
            - name: Restart Service
              uses: appleboy/ssh-action@master
              with:
                # EC2 접속 정보
                host: ${{ secrets.HOST }}
                username: ${{ secrets.USERNAME }}
                key: ${{ secrets.EC2KEY }}
                port: 22      
                # 스크립트 -> 접속후 처리해야 할 명령어 n개 나열
                script: |
                  # 코드가 엄청 증가, 새로운 패키지 사용하여 업데이트 => 패키지 설치 필요
                  # 가상환경 활성화 => 패키지 설치 추가되어야 함
                  # cd /home/ubuntu/projects
                  # ./web/bin/pip install -r requirements.txt
                  sudo systemctl restart hello.service
              